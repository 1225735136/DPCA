_BASE_: 'train_dav2_correction_nuscenes.yaml'
EXPERIMENT_NAME: 'train-md4allDD-dav2-small-nuscenes'

TRAINING:
  EPOCHS: 5
  BATCH_SIZE: 4

VALIDATION:
  BATCH_SIZE: 1

SAVE:
  CHECKPOINT_PATH: 'log/checkpoints/md4allDD_dav2_small_nuscenes'
  MONITOR: 'metrics_night/everything/abs_rel'

LOAD:
  CHECKPOINT_PATH: null
  DAYTIME_TRANSLATION_TEACHER_PATH: 'log/checkpoints/dav2_correction_nuscenes/teacher.ckpt'
  DAY_NIGHT_TRANSLATION_PATH: '/path/to/nuScenes-md4all/trainval/translated/night'
  DAY_CLEAR_DAY_RAIN_TRANSLATION_PATH: '/path/to/nuScenes-md4all/trainval/translated/rain'

DATASET:
  LOAD:
    GT:
      POSE: False
  WEATHER:
    VAL: ['day-clear', 'day-rain', 'night-clear', 'night-rain']
    TEST: ['day-clear', 'day-rain', 'night-clear', 'night-rain']
  AUGMENTATION:
    GAUSSIAN_NOISE:
      PROBABILITY: 0.5
    DAY_NIGHT_TRANSLATION:
      PROBABILITY: 0.33
    DAY_CLEAR_DAY_RAIN_TRANSLATION:
      PROBABILITY: 0.5

MODEL:
  DEPTH:
    TYPE: 'dav2_small'
    DAV2:
      PRETRAINED_PATH: 'pretrained/depth_anything_v2_metric_vkitti_vits.pth'
      ENCODER_LR_FACTOR: 0.1

OPTIMIZER:
  DEPTH_LR: 0.0001

LOSS:
  PHOTOMETRIC:
    WEIGHT: 0.0
  VELOCITY_WEIGHT: 0.0
  SMOOTHNESS_WEIGHT: 0.0
  SUPERVISED:
    WEIGHT: 1.0
    TEACHER_TYPE: 'dav2_correction'
    METHOD: 'abs_rel'
