EXPERIMENT_NAME: 'train-dav2-correction-nuscenes'

SYSTEM:
  NUM_WORKERS: 4
  PERSISTENT_WORKERS: True

TRAINING:
  BATCH_SIZE: 4

VALIDATION:
  BATCH_SIZE: 4

SAVE:
  CHECKPOINT_PATH: 'log/checkpoints/dav2_correction_nuscenes'
  MONITOR: 'metrics_day-clear/everything/abs_rel'
  LOGGING_INTERVAL: 50

DATASET:
  NAME: 'nuscenes'
  DATAROOT: '/path/to/nuScenes-md4all'
  WEATHER:
    TRAIN: ['day-clear']
    VAL: ['day-clear']
    TEST: ['day-clear']
  PSEUDO_DEPTH:
    ENABLED: True
    METRIC_PATH: '/path/to/nuScenes-md4all/trainval/pseudo_labels_depthanything_v2_metric_png'
    RELATIVE_PATH: '/path/to/nuScenes-md4all/trainval/pseudo_labels_depthanything_v2_relative_png'
  AUGMENTATION:
    RESIZE:
      CORRECT_INTRINSICS: True

MODEL:
  DEPTH:
    TYPE: 'dav2_correction'
    CORRECTION:
      CHANNELS: 32
      MAX_LOG_RESIDUAL: 3.0

LOSS:
  PHOTOMETRIC:
    WEIGHT: 1.0
    MASK_INVALID: True
  VELOCITY_WEIGHT: 0.02
  SMOOTHNESS_WEIGHT: 0.001
  SUPERVISED:
    WEIGHT: 0.0

EVALUATION:
  DEPTH:
    MAX_DEPTH: 80.0
